baseurl = "https://www.gunis.ai/"
title = "Gunis"
# Default theme restored to Creative Portfolio (Hugo Narrow kept as optional secondary)
theme = "creative-portfolio"
languageCode = "en-us"

# Enable comments by entering your Disqus shortname
disqusShortname = ""
# Enable Google Analytics by entering your tracking code
googleAnalytics = "GTM-5X7GT3NK"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  customCSS = ["css/custom.css"]

  # Style options: default (pink), blue, green, pink, red, sea, violet
  # Use custom.css for your custom styling
  style = "default"
  description = "Creative merchandise for programmers, developers, engineers, geeks and researchers"
  keywords = ["t-shirt", "merch", "developer", "engineer", "geek", "gift", "graphic tee", "tech apparel"]
  copyright = "&copy;2025 Gunis LLC. All rights reserved."
  sidebarAbout = [
    "We are a small enterprise busy making creative goodies for programmers, developers, engineers, geeks and researchers.",
    "Designed in Seattle, USA."
  ]
  # Contact page
     # Since this template is static, the contact form uses www.formspree.io as a
     # proxy. The form makes a POST request to their servers to send the actual
     # email. Visitors can send up to a 1000 emails each month for free.
     #
     # What you need to do for the setup?
     #
     # - set your email address under 'email' below
     # - upload the generated site to your server
     # - send a dummy email yourself to confirm your account
     # - click the confirm link in the email from www.formspree.io
     # - you're done. Happy mailing!
  email = "xoqobzvk"

    # Optional Matomo analytics (formerly piwik)
      # [params.analytics.matomo]
      #  URL = "https://stats.example.com"
      #  ID = "42"
      #  # Track all subdomains with "*.example.com" (Optional)
      #  domain = "www.example.com"
      #  # Optional integrity check hash
      #  hash = ""

  # Nav links in the side bar (legacy creative-portfolio)
  [[params.navlinks]]
  name = "Home"
  url = "portfolio/"
  home = true

  [[params.navlinks]]
  name = "About"
  url = "about/"

  [[params.navlinks]]
  name = "Get in touch"
  url = "contact/"

  [params.social]
  #facebook      = "full page or profile url in facebook"
  #googleplus    = "full profile url in googleplus"
  #linkedin      = "full profile url in linkedin"
  #stackoverflow = "full profile url in stackoverflow"
  #github        = "full profile url in github"
  #gitlab        = "full profile url in gitlab"
  #youtube       = "full profile url in youtube"
  #whatsapp      = "wa.me service link"
  email         = "info@gunis.ai"
  twitter       = "https://twitter.com/sytelus"
  instagram     = "https://instagram.com/sytelus"

  # Additional site/meta used by Hugo Narrow
  images = ["/img/portfolio/et-al/et-al.jpg"]
  defaultAuthor = "Gunis"
  language = "en-US"
  shortName = "Gunis"

[params.author]
name = "Gunis"
title = "Creative merchandise for programmers, engineers & researchers"
description = "Premium graphic tees and merch with clean, modern art for tech folks."
avatar = "/img/logo.png"
  [[params.author.social]]
  name = "Twitter"
  url = "https://twitter.com/sytelus"
  icon = "twitter"
  [[params.author.social]]
  name = "Instagram"
  url = "https://instagram.com/sytelus"
  icon = "instagram"
  [[params.author.social]]
  name = "Email"
  url = "mailto:info@gunis.ai"
  icon = "email"

[params.home]
recentPostsCount = 6

[params.home_custom]
enabled = false

[params.logo]
image = ""
link = "/"

[params.favicon]
